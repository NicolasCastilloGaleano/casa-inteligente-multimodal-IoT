; Tres entornos:
;   esp32dev -> firmware principal para el ESP32 físico      (pio run -e esp32dev -t upload)
;   wokwi    -> mismo firmware para el simulador Wokwi       (pio run -e wokwi)
;   pruebas  -> menú para probar cada componente por serie   (pio run -e pruebas -t upload)

[platformio]
src_dir = src
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; El Bluetooth ocupa mucha memoria: partición "huge_app" (3 MB para el programa).
; En Arduino IDE: Herramientas -> Partition Scheme -> "Huge APP (3MB No OTA/1MB SPIFFS)".
board_build.partitions = huge_app.csv
lib_deps =
  madhephaestus/ESP32Servo
  miguelbalboa/MFRC522@^1.4.11

[env:esp32dev]
build_src_filter = +<*> -<pruebas.cpp>

[env:wokwi]
build_src_filter = +<*> -<pruebas.cpp>
; Wokwi: relé activo en ALTO, sin lector RFID ni Bluetooth (la web se conecta por el puerto serie virtual).
build_flags = -DRELE_ACTIVO_EN_BAJO=false -DSIMULACION_WOKWI=1 -DCOM_BLUETOOTH=0 -DCOM_WIFI=0
board_build.partitions = default.csv

[env:pruebas]
build_src_filter = +<*> -<main.cpp>
build_flags = -DCOM_BLUETOOTH=0 -DCOM_WIFI=0
